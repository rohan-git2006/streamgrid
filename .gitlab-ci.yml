stages:
  - test
  - build

variables:
  GOTOOLCHAIN: auto

test:
  stage: test
  image: golang:1.23
  services:
    - name: redis:7
      alias: redis
  variables:
    REDIS_ADDR: "redis:6379"
  script:
    - 'test -z "$(gofmt -l cmd internal)"'
    - go vet ./...
    - go test ./... -count=1 -v

build-images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      for svc in broker agent; do
        docker build --build-arg SERVICE=$svc -t "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/$svc:latest" .
        docker push --all-tags "$CI_REGISTRY_IMAGE/$svc"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH