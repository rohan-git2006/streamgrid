services:
  redis:
    image: redis:7
    container_name: sg-redis
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    container_name: sg-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./schema.cql:/schema.cql
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  broker:
    build:
      context: .
      args:
        SERVICE: broker
    image: streamgrid-broker:latest
    depends_on:
      redis:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis:6379
      CASSANDRA_HOST: cassandra
    ports:
      - "8080:8080"

  agent:
    build:
      context: .
      args:
        SERVICE: agent
    image: streamgrid-agent:latest
    depends_on:
      redis:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis:6379
      CASSANDRA_HOST: cassandra
    command: ["-nodes", "12", "-capacity", "4"]