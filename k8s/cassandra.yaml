apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: {app: cassandra}
  template:
    metadata:
      labels: {app: cassandra}
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          env:
            - {name: MAX_HEAP_SIZE, value: 512M}
            - {name: HEAP_NEWSIZE, value: 128M}
          ports:
            - containerPort: 9042
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cqlsh -e 'describe keyspaces'"]
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
spec:
  selector: {app: cassandra}
  ports:
    - port: 9042